name: embossed_card_scanner
description: "Reads embossed payment card numbers on device with a small CNN. Headless API for photos and your own frame streams, plus a ready camera widget with a torch."
version: 1.0.0
# TODO: set before publishing.
# repository: https://github.com/<owner>/embossed_card_scanner
# issue_tracker: https://github.com/<owner>/embossed_card_scanner/issues

topics:
  - credit-card
  - scanner
  - camera
  - ocr
  - tflite

platforms:
  android:
  ios:

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  image: ^4.12.0
  meta: ^1.16.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/models/
